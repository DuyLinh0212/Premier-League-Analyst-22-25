name: Premier League - Airflow HDFS PostgreSQL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premier-league-local-pipeline
  cancel-in-progress: false

jobs:
  historical-pipeline:
    runs-on: [self-hosted, Windows, X64, plca-local]
    timeout-minutes: 360
    env:
      PLCA_RAW_SOURCE: F:\NgDuyLinh\Do_an\BigData\Premier-League-Analyst-22-25\data\raw
      PLCA_RUN_ID: ci_${{ github.run_id }}_${{ github.run_attempt }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout mã theo commit trong workspace riêng
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src
            scripts
            config
            apps/analytics-web
            airflow
            .github
      - name: Chuẩn bị nguồn lịch sử từ máy cục bộ
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Start-Transcript -Path artifacts/bootstrap.log -Append
          try { .\scripts\prepare_pipeline_ci.ps1 } finally { Stop-Transcript }
      - name: Kiểm tra PowerShell 5.1 và cầu nối WSL
        run: .\src\pipeline\tests\check_setup_bridge.ps1
      - name: Chuyển bản triển khai và kiểm tra môi trường
        run: |
          .\scripts\run_pipeline.ps1 -Action stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\run_pipeline.ps1 -Action setup -SkipPostgresSetup
          exit $LASTEXITCODE
      - name: Chạy kiểm thử, build Web và DAG bằng scheduler thật
        run: |
          .\scripts\run_pipeline.ps1 -Action run -RunId $env:PLCA_RUN_ID
          exit $LASTEXITCODE
      - name: Thu thập log và ảnh minh chứng kể cả khi lỗi
        if: always()
        run: |
          .\scripts\collect_pipeline_evidence.ps1 -RunId $env:PLCA_RUN_ID
          exit $LASTEXITCODE
      - name: Lưu artifact 30 ngày
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premier-league-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
