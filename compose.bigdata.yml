name: premier-league-hdfs-airflow-ci
x-hadoop-env: &hadoop-env
  CLUSTER_NAME: premier-league-ci
  CORE_CONF_fs_defaultFS: hdfs://namenode:9000
  HDFS_CONF_dfs_replication: "2"
  HDFS_CONF_dfs_blocksize: "67108864"
  HDFS_CONF_dfs_permissions_enabled: "false"
  HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname_check: "false"
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow-ci-only@airflow-db:5432/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ci-only-ephemeral-execution-jwt-key
  AIRFLOW__API__SECRET_KEY: ci-only-ephemeral-airflow-key
  AIRFLOW__WEBSERVER__SECRET_KEY: ci-only-ephemeral-web-key
  PYTHONPATH: /opt/project:/opt/project/apps/api:/opt/project/apps/api/football:/opt/project/ml/inference:/opt/project/processing/spark:/opt/spark/python/lib/pyspark.zip:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
  HDFS_URI: hdfs://namenode:9000
  HDFS_BASE_PATH: /premier-league
  NAMENODE_HTTP_URI: http://namenode:9870
  HDFS_MIN_DATANODES: "3"
  HADOOP_USER_NAME: root
  SPARK_MASTER: local[2]
  SPARK_LOCAL_IP: 127.0.0.1
  STATE_DIR: /state
  APP_NAMESPACE: premier-league-22-25
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC: league_table_simulated
  NEON_DATABASE_URL: ${NEON_DATABASE_URL:?Set GitHub Actions secret NEON_DATABASE_URL}
  PIPELINE_RUN_ID: ${PIPELINE_RUN_ID:?Set a unique pipeline run ID}
services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_LOG_RETENTION_BYTES: -1
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "league_table_simulated", "--partitions", "1", "--replication-factor", "1"]
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    hostname: namenode
    ports: ["9870:9870"]
    environment: *hadoop-env
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9870/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode1
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: namenode:9870
    depends_on: {namenode: {condition: service_healthy}}
  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode2
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: namenode:9870
    depends_on: {namenode: {condition: service_healthy}}
  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    hostname: datanode3
    environment:
      <<: *hadoop-env
      SERVICE_PRECONDITION: namenode:9870
    depends_on: {namenode: {condition: service_healthy}}
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow-ci-only
      POSTGRES_DB: airflow
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 30
  airflow-cli:
    image: football-airflow:4.0
    command: ["sleep", "infinity"]
    depends_on:
      airflow-db: {condition: service_healthy}
      namenode: {condition: service_healthy}
      kafka: {condition: service_healthy}
      datanode1: {condition: service_started}
      datanode2: {condition: service_started}
      datanode3: {condition: service_started}
    environment: *airflow-env
    volumes:
      - pipeline-runs:/opt/project/pipeline_runs
      - airflow-state:/state
  airflow-api-server:
    image: football-airflow:4.0
    command: ["airflow", "api-server", "--host", "0.0.0.0"]
    depends_on:
      airflow-db: {condition: service_healthy}
      namenode: {condition: service_healthy}
    environment: *airflow-env
    volumes:
      - pipeline-runs:/opt/project/pipeline_runs
      - airflow-state:/state
volumes:
  pipeline-runs:
  airflow-state:
