name: ${COMPOSE_PROJECT_NAME:-premier-league-app}
x-env: &env
  NEO4J_HTTP_URI: ${NEO4J_HTTP_URI:?Configure existing Neo4j URL}
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Configure existing Neo4j password}
  NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?Configure existing Kafka address}
  HDFS_URI: ${HDFS_URI:?Configure existing HDFS address}
  HDFS_BASE_PATH: ${HDFS_BASE_PATH:-/bigdata}
  NAMENODE_HTTP_URI: ${NAMENODE_HTTP_URI:-http://host.docker.internal:9870}
  HDFS_MIN_DATANODES: ${HDFS_MIN_DATANODES:-1}
  HADOOP_USER_NAME: ${HADOOP_USER_NAME:-}
  SPARK_MASTER: ${SPARK_MASTER:-local[2]}
  APP_NAMESPACE: ${APP_NAMESPACE:-premier-league-22-25}
  TRANSFER_TOPIC: ${TRANSFER_TOPIC:-fact_transfers_topic}
services:
  runtime:
    image: ${RUNTIME_IMAGE:-football-runtime:4.0}
    build: {context: .., dockerfile: portable/Dockerfile.runtime, target: runtime}
    profiles: [tools]
    environment: *env
    volumes: [pipeline_runs:/opt/project/pipeline_runs, runtime_state:/state]
    extra_hosts: ['host.docker.internal:host-gateway']
  publish:
    image: ${RUNTIME_IMAGE:-football-runtime:4.0}
    command: [python, -m, analytics.publish]
    profiles: [tools]
    environment: *env
    extra_hosts: ['host.docker.internal:host-gateway']
  api:
    image: ${API_IMAGE:-football-api:4.0}
    build: {context: .., dockerfile: portable/Dockerfile.runtime, target: api}
    environment: *env
    ports: ['${API_PORT:-8000}:8000']
    extra_hosts: ['host.docker.internal:host-gateway']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 20
    restart: unless-stopped
  web:
    image: ${WEB_IMAGE:-football-web:4.0}
    build: {context: .., dockerfile: portable/Dockerfile.web}
    environment: {FOOTBALL_API_URL: 'http://api:8000', HOSTNAME: '0.0.0.0', NODE_OPTIONS: '--max-old-space-size=256'}
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on: {api: {condition: service_healthy}}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      retries: 20
    restart: unless-stopped
volumes:
  pipeline_runs:
  runtime_state:
